<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProBid — Data Integrity Self-Test</title>
<style>
  :root{ --ok:#2e7d32; --okbg:#e8f5e9; --bad:#c62828; --badbg:#fdecea; --ink:#0d1b2a; --mut:#607d8b; --line:#e0e0e0; }
  *{box-sizing:border-box} body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f5f7fa;color:var(--ink)}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:#1565c0;color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .verdict{font-weight:900;font-size:15px;padding:10px 16px;border-radius:10px;display:none}
  .verdict.pass{display:inline-block;background:var(--okbg);color:var(--ok);border:1.5px solid #a5d6a7}
  .verdict.fail{display:inline-block;background:var(--badbg);color:var(--bad);border:1.5px solid #ef9a9a}
  .grp{margin:18px 0 6px;font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--mut);text-transform:uppercase}
  .row{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:11px 14px;margin-bottom:8px}
  .row.ok{border-left-color:var(--ok)} .row.bad{border-left-color:var(--bad)} .row.run{border-left-color:#90a4ae}
  .ic{font-size:16px;line-height:1.4;width:20px;flex-shrink:0} .ok .ic{color:var(--ok)} .bad .ic{color:var(--bad)}
  .t{font-weight:700;font-size:14px} .d{color:var(--mut);font-size:12px;margin-top:2px;white-space:pre-wrap}
  .muted{color:var(--mut);font-size:12px}
  code{background:#eef2f7;padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧪 ProBid — Data Integrity Self-Test</h1>
  <p class="sub">Proves the per-row design holds under concurrent use, against the live database. Creates clearly-named <code>SELFTEST</code> data and removes it automatically. Open while signed in to ProBid in this browser.</p>
  <div class="bar">
    <button id="run">Run all checks</button>
    <span id="verdict" class="verdict"></span>
    <span id="who" class="muted"></span>
  </div>
  <div id="out"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://jzvoksidbelxibzbizvi.supabase.co';
const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6dm9rc2lkYmVseGliemJpenZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjQ3MTQsImV4cCI6MjA5NDIwMDcxNH0.DfZZsGXnRgPqG0alp8PXuB7d_2AOJnsRMX3nHYVhGE8';
const out=document.getElementById('out');
let results=[], curGroup='';
function group(g){ curGroup=g; const d=document.createElement('div'); d.className='grp'; d.textContent=g; out.appendChild(d); }
function add(name){ const row=document.createElement('div'); row.className='row run'; row.innerHTML='<div class="ic">⏳</div><div><div class="t"></div><div class="d"></div></div>'; row.querySelector('.t').textContent=name; out.appendChild(row); return row; }
function mark(row,pass,detail){ row.className='row '+(pass?'ok':'bad'); row.querySelector('.ic').textContent=pass?'✓':'✕'; row.querySelector('.d').textContent=detail||''; results.push(!!pass); }

async function setupAuth(){
  const sb = supabase.createClient(SUPA_URL, SUPA_ANON, {auth:{persistSession:false, autoRefreshToken:false}});
  // reuse the app's stored session (same origin)
  let tok=null; try{ tok=JSON.parse(localStorage.getItem('sb-jzvoksidbelxibzbizvi-auth-token')); }catch(e){}
  const sess = tok && (tok.access_token ? tok : (tok.currentSession||tok.session));
  if(!sess || !sess.access_token) throw new Error('Not signed in to ProBid in this browser — open the app and log in first, then reload this page.');
  await sb.auth.setSession({access_token:sess.access_token, refresh_token:sess.refresh_token});
  const u = (await sb.auth.getUser()).data.user;
  if(!u) throw new Error('Session found but could not resolve user.');
  window._sb = sb;
  window.DB = window.DB || {};
  window._currentUser = { id:u.id, role:'owner' };
  return u;
}

async function run(){
  document.getElementById('run').disabled=true;
  out.innerHTML=''; results=[];
  const verdict=document.getElementById('verdict'); verdict.className='verdict'; verdict.textContent='';
  try {
    const u = await setupAuth();
    document.getElementById('who').textContent = 'signed in as '+(u.email||u.id.slice(0,8));
    if(!window.ToolsDB){ throw new Error('tools_db.js did not load (ToolsDB missing).'); }
    if(!window.CheckoutsDB){ throw new Error('checkouts_db.js did not load (CheckoutsDB missing).'); }
    if(!window.InvLocationsDB){ throw new Error('inventory_locations_db.js did not load (InvLocationsDB missing).'); }
  } catch(e){
    group('Setup'); const r=add('Authenticate with your ProBid session'); mark(r,false,e.message);
    finish(); return;
  }

  const sb=window._sb, TAG='SELFTEST';
  const base={ cat:'Selftest' };
  async function freshLoad(nameIncludes){ const list=await ToolsDB.load(); return list.filter(t=>(t.name||'').indexOf(nameIncludes)>=0); }
  async function softDeleteSelftest(){
    // teardown: retire any SELFTEST tools + their groups (soft delete; invisible to the app)
    const all=await ToolsDB.load(); const mine=all.filter(t=>(t.name||'').indexOf(TAG)===0);
    for(const t of mine){ await ToolsDB.retireTool(t._uuid); }
    return mine.length;
  }
  function today(){ return new Date().toISOString().split('T')[0]; }
  async function freshCO(nameIncludes){ const list=await CheckoutsDB.load(); return list.filter(c=>(c.toName||'').indexOf(nameIncludes)>=0); }
  async function softDeleteSelftestCheckouts(){
    // teardown: retire any SELFTEST custody rows (soft delete; invisible to the app)
    const all=await CheckoutsDB.load(); const mine=all.filter(c=>(c.toName||'').indexOf('SELFTEST')===0);
    for(const c of mine){ await CheckoutsDB.retire(c._uuid); }
    return mine.length;
  }
  async function freshLoc(nameIncludes){ const list=await InvLocationsDB.load(); return list.filter(l=>(l.name||'').indexOf(nameIncludes)>=0); }
  async function softDeleteSelftestLocs(){
    const all=await InvLocationsDB.load(); const mine=all.filter(l=>(l.name||'').indexOf('SELFTEST')===0);
    for(const l of mine){ await InvLocationsDB.retire(l._uuid); }
    return mine.length;
  }

  // ---- SETUP ----
  group('Setup');
  let r=add('Authenticate + load real tools_db.js'); mark(r,true,'ToolsDB present; running against live DB.');
  r=add('Clean any leftover SELFTEST data from a prior run');
  try{ const nc=await softDeleteSelftestCheckouts(); const n=await softDeleteSelftest(); mark(r,true,'retired '+nc+' leftover checkout(s) + '+n+' tool(s).'); }catch(e){ mark(r,false,e.message); }

  // ---- PER-ROW CORE ----
  group('Per-row core (the fix)');

  // T: create two DIFFERENT tools concurrently -> both survive
  r=add('Two writers create DIFFERENT tools at once → both survive');
  try{
    const [a,b]=await Promise.all([
      ToolsDB.saveTool({id:TAG+'-A-'+Date.now(), name:TAG+' Alpha', cat:'Selftest', linkedGroups:[{id:'g1',label:'Part One',mode:'required'},{id:'g2',label:'Part Two',mode:'optional'}]}),
      ToolsDB.saveTool({id:TAG+'-B-'+Date.now(), name:TAG+' Bravo', cat:'Selftest', linkedGroups:[]})
    ]);
    const found=await freshLoad(TAG+' ');
    const ok = a.ok && b.ok && found.some(t=>t.name===TAG+' Alpha') && found.some(t=>t.name===TAG+' Bravo');
    mark(r, ok, ok?'Both Alpha and Bravo persisted independently.':'saveA='+JSON.stringify(a)+' saveB='+JSON.stringify(b));
  }catch(e){ mark(r,false,e.message); }

  // T: two writers edit the SAME tool -> stale one rejected
  r=add('Two writers edit the SAME tool at once → stale one REJECTED (no clobber)');
  try{
    const alpha=(await freshLoad(TAG+' ')).find(t=>t.name===TAG+' Alpha');
    const s1=Object.assign({},alpha); s1.notes='writer-1';
    const s2=Object.assign({},alpha); s2.notes='writer-2';
    const w1=await ToolsDB.saveTool(s1);
    const w2=await ToolsDB.saveTool(s2);
    const after=(await freshLoad(TAG+' ')).find(t=>t.name===TAG+' Alpha');
    const ok = w1.ok && w2.conflict===true && after.notes==='writer-1';
    mark(r, ok, ok?'Writer 1 saved; writer 2 was rejected with a conflict; writer 1\'s value kept.':'w1='+JSON.stringify(w1)+' w2='+JSON.stringify(w2)+' finalNotes='+(after&&after.notes));
  }catch(e){ mark(r,false,e.message); }

  // ---- FIDELITY ----
  group('Data fidelity');

  // T: linked parts persist
  r=add('Linked parts persist with the tool');
  try{ const alpha=(await freshLoad(TAG+' ')).find(t=>t.name===TAG+' Alpha'); const n=(alpha.linkedGroups||[]).length; mark(r, n===2, n===2?'2 parts round-tripped (Part One, Part Two).':'expected 2 parts, got '+n); }catch(e){ mark(r,false,e.message); }

  // T: photo link persists through a reload
  r=add('Photo link persists through a reload');
  try{
    const alpha=(await freshLoad(TAG+' ')).find(t=>t.name===TAG+' Alpha');
    const url='https://jzvoksidbelxibzbizvi.supabase.co/storage/v1/object/public/tool-photos/selftest/x.jpg';
    const e1=Object.assign({},alpha); e1.photoUrl=url;
    const sv=await ToolsDB.saveTool(e1);
    const after=(await freshLoad(TAG+' ')).find(t=>t.name===TAG+' Alpha');
    const ok = sv.ok && after.photoUrl===url;
    mark(r, ok, ok?'Photo link saved per-row and survived reload.':'save='+JSON.stringify(sv)+' got='+(after&&after.photoUrl));
  }catch(e){ mark(r,false,e.message); }

  // T: checkout-linkage id shape (legacy id preserved for compatibility)
  r=add('Tool id stays stable for checkout linkage');
  try{ const alpha=(await freshLoad(TAG+' ')).find(t=>t.name===TAG+' Alpha'); const ok=!!alpha.id && !!alpha._uuid; mark(r, ok, ok?('app id="'+alpha.id+'" (what checkouts reference); table uuid tracked separately.'):'missing id/_uuid'); }catch(e){ mark(r,false,e.message); }

  // ---- CHECKOUTS / CUSTODY (per-row) ----
  group('Checkouts — per-row custody (the fix)');
  var RIG=null;

  r=add('Prepare a SELFTEST tool to check out');
  try{
    var rigId='SELFTEST-CO-RIG-'+Date.now();
    var rsv=await ToolsDB.saveTool({id:rigId, name:'SELFTEST Checkout Rig', cat:'Selftest',
      linkedGroups:[{id:'cg1',label:'Case',mode:'required'},{id:'cg2',label:'Battery',mode:'optional'}]});
    window.DB.tools = await ToolsDB.load();                 // so CheckoutsDB can resolve tool_id
    var rigApp=(DB.tools||[]).find(function(t){ return t.name==='SELFTEST Checkout Rig'; });
    RIG = rigApp && rigApp.id;
    mark(r, rsv.ok && !!RIG, (rsv.ok&&RIG)?('rig ready (app id="'+RIG+'" resolves to a real tool uuid).'):'could not create rig: '+JSON.stringify(rsv));
  }catch(e){ mark(r,false,e.message); }

  r=add('Two writers create DIFFERENT checkouts at once → both survive');
  try{
    var coA={id:'ST-CO-A-'+Date.now(), toolId:RIG, toName:'SELFTEST Al', jobName:'Job One', date:today(), status:'checked_out',
      groupsIncluded:[{groupId:'cg1',label:'Case',included:true,mode:'required'},{groupId:'cg2',label:'Battery',included:true,mode:'optional'}]};
    var coB={id:'ST-CO-B-'+Date.now(), toolId:RIG, toName:'SELFTEST Bob', jobName:'Job Two', date:today(), status:'checked_out', groupsIncluded:[]};
    var pair=await Promise.all([CheckoutsDB.save(coA), CheckoutsDB.save(coB)]);
    var found=await freshCO('SELFTEST ');
    var ok = pair[0].ok && pair[1].ok && found.some(function(c){return c.toName==='SELFTEST Al';}) && found.some(function(c){return c.toName==='SELFTEST Bob';});
    mark(r, ok, ok?'Both custody records persisted independently (old blob would have lost one).':'A='+JSON.stringify(pair[0])+' B='+JSON.stringify(pair[1]));
  }catch(e){ mark(r,false,e.message); }

  r=add('Two writers edit the SAME checkout at once → stale one REJECTED (no clobber)');
  try{
    var al0=(await freshCO('SELFTEST Al'))[0];
    var s1=Object.assign({},al0); s1.jobName='by-writer-1';
    var s2=Object.assign({},al0); s2.jobName='by-writer-2';
    var w1=await CheckoutsDB.save(s1);
    var w2=await CheckoutsDB.save(s2);
    var afterE=(await freshCO('SELFTEST Al'))[0];
    var ok = w1.ok && w2.conflict===true && afterE.jobName==='by-writer-1';
    mark(r, ok, ok?'Writer 1 saved; writer 2 rejected with a conflict; writer 1\'s value kept.':'w1='+JSON.stringify(w1)+' w2='+JSON.stringify(w2)+' job='+(afterE&&afterE.jobName));
  }catch(e){ mark(r,false,e.message); }

  r=add('Field hand-off (pending → accept) moves custody; stayed-behind parts split off');
  try{
    var al=(await freshCO('SELFTEST Al'))[0];
    // sender proposes the hand-off; Case travels, Battery stays
    al.pendingTransfer={ to:'SELFTEST Cara', by:al.toName, byUser:'tester', at:today(),
      travel:[{groupId:'cg1',label:'Case',included:true,mode:'required'}],
      stay:[{groupId:'cg2',label:'Battery',included:true,mode:'optional'}],
      note:'field handoff', expiresAt:Date.now()+86400000 };
    var pend=await CheckoutsDB.save(al);
    var alP=(await freshCO('SELFTEST Al'))[0];
    var pendOk = pend.ok && alP.pendingTransfer && alP.pendingTransfer.to==='SELFTEST Cara' &&
      (alP.pendingTransfer.travel||[]).length===1 && (alP.pendingTransfer.stay||[]).length===1;
    // receiver accepts: close sender, open receiver, split the stay
    var now=today();
    delete alP.pendingTransfer;
    alP.returnedAt=now; alP.status='verified'; alP.transferredTo='SELFTEST Cara';
    alP.groupsIncluded=[{groupId:'cg1',label:'Case',included:true,mode:'required'}];
    var cl=await CheckoutsDB.save(alP);
    var recv={id:'ST-CO-R-'+Date.now(), toolId:RIG, toName:'SELFTEST Cara', jobName:al.jobName, date:now, status:'checked_out',
      groupsIncluded:[{groupId:'cg1',label:'Case',included:true,mode:'required'}],
      transferredFrom:'SELFTEST Al', transferMode:'peer', acceptedBy:'SELFTEST Cara', acceptedAt:now, transferPriorCoId:al.id};
    var rc=await CheckoutsDB.save(recv);
    var split={id:'ST-CO-S-'+Date.now(), toolId:RIG, toName:'SELFTEST Al', jobName:al.jobName, date:now, status:'checked_out',
      groupsIncluded:[{groupId:'cg2',label:'Battery',included:true,mode:'optional'}],
      isGroupSplit:true, splitFromToolId:RIG, notes:'Battery stayed with SELFTEST Al'};
    var sp=await CheckoutsDB.save(split);
    var all=await freshCO('SELFTEST ');
    var sender=all.find(function(c){return c.toName==='SELFTEST Al' && !c.isGroupSplit;});
    var receiver=all.find(function(c){return c.toName==='SELFTEST Cara';});
    var splitRec=all.find(function(c){return c.isGroupSplit;});
    var ok = pendOk && cl.ok && rc.ok && sp.ok &&
      sender && sender.returnedAt && sender.status==='verified' && sender.transferredTo==='SELFTEST Cara' &&
      receiver && !receiver.returnedAt && receiver.transferredFrom==='SELFTEST Al' && receiver.transferMode==='peer' && receiver.acceptedBy==='SELFTEST Cara' &&
      splitRec && splitRec.isGroupSplit===true && splitRec.toName==='SELFTEST Al' && (splitRec.groupsIncluded||[]).length===1 && splitRec.toolId===RIG;
    mark(r, ok, ok?'Cara holds it (peer-accepted), Al released, Battery stayed behind as a real split row — no "_groups" fake id.':
      'pendOk='+pendOk+' close='+JSON.stringify(cl)+' recv='+JSON.stringify(rc)+' split='+JSON.stringify(sp)+' sender='+!!sender+' receiver='+!!receiver+' splitRec='+!!splitRec);
  }catch(e){ mark(r,false,e.message); }

  r=add('Active-holder lookup ignores the split row (new rule: !isGroupSplit)');
  try{
    var active=(await freshCO('SELFTEST ')).filter(function(c){ return c.toolId===RIG && !c.returnedAt && !c.isGroupSplit; });
    var names=active.map(function(c){return c.toName;}).sort();
    var ok = active.every(function(c){ return !c.isGroupSplit; }) && names.indexOf('SELFTEST Cara')>=0;
    mark(r, ok, ok?('live holders of the rig: '+names.join(', ')+' — the stayed-behind split row is correctly excluded.'):'active='+JSON.stringify(names));
  }catch(e){ mark(r,false,e.message); }

  r=add('Return → verify closes the record and round-trips');
  try{
    var bob=(await freshCO('SELFTEST Bob'))[0];
    bob.status='pending_verify'; bob.returnedAt=today(); bob.returnSubmittedAt=today(); bob.returnSubmittedBy='SELFTEST Bob'; bob.dropoffLocation='shop shelf';
    var rr1=await CheckoutsDB.save(bob);
    var pv=(await freshCO('SELFTEST Bob'))[0];
    var pvOk = rr1.ok && pv.status==='pending_verify' && pv.dropoffLocation==='shop shelf';
    pv.status='verified'; pv.verifiedAt=today(); pv.verifiedBy='SELFTEST Office';
    var rr2=await CheckoutsDB.save(pv);
    var done=(await freshCO('SELFTEST Bob'))[0];
    var ok = pvOk && rr2.ok && done.status==='verified' && done.verifiedBy==='SELFTEST Office' && !!done.returnedAt;
    mark(r, ok, ok?'Pending-verify → verified persisted; closed record kept for history (status verified, returnedAt set).':'pvOk='+pvOk+' r2='+JSON.stringify(rr2)+' status='+(done&&done.status)+' by='+(done&&done.verifiedBy));
  }catch(e){ mark(r,false,e.message); }

  r=add('Take-as-is custody chain persists');
  try{
    var asis={id:'ST-CO-AI-'+Date.now(), toolId:RIG, toName:'SELFTEST Dan', date:today(), status:'checked_out', groupsIncluded:[],
      takenAsIs:true, asIsFrom:'SELFTEST Bob', asIsAckBy:'SELFTEST Dan', asIsApprovedBy:'SELFTEST Mgr', asIsPriorCoId:'prior-x'};
    var asv=await CheckoutsDB.save(asis);
    var back=(await freshCO('SELFTEST Dan'))[0];
    var ok = asv.ok && back.takenAsIs===true && back.asIsFrom==='SELFTEST Bob' && back.asIsApprovedBy==='SELFTEST Mgr' && back.asIsPriorCoId==='prior-x';
    mark(r, ok, ok?'As-is chain (from / ack-by / approved-by / prior) round-tripped.':'sv='+JSON.stringify(asv)+' back='+JSON.stringify(back));
  }catch(e){ mark(r,false,e.message); }

  r=add('Included parts (groups) persist on a checkout');
  try{
    var cara=(await freshCO('SELFTEST Cara'))[0];
    var n=(cara.groupsIncluded||[]).length;
    mark(r, n===1, n===1?'Cara\'s checkout kept its 1 traveling part (Case).':'expected 1 group, got '+n);
  }catch(e){ mark(r,false,e.message); }

  // ---- INVENTORY LOCATIONS (per-row) ----
  group('Inventory locations — per-row (the fix)');

  r=add('Clean any leftover SELFTEST locations');
  try{ const n=await softDeleteSelftestLocs(); mark(r,true,'retired '+n+' leftover test location(s).'); }catch(e){ mark(r,false,e.message); }

  r=add('Two writers create DIFFERENT locations at once → both survive');
  try{
    const la={id:'SELFTEST-LOC-A-'+Date.now(), name:'SELFTEST Truck A', type:'vehicle', isDefault:false};
    const lb={id:'SELFTEST-LOC-B-'+Date.now(), name:'SELFTEST Truck B', type:'vehicle', isDefault:false};
    const [ra,rb]=await Promise.all([InvLocationsDB.save(la), InvLocationsDB.save(lb)]);
    const found=await freshLoc('SELFTEST Truck');
    const ok = ra.ok && rb.ok && found.some(l=>l.name==='SELFTEST Truck A') && found.some(l=>l.name==='SELFTEST Truck B');
    mark(r, ok, ok?'Both locations persisted independently.':'A='+JSON.stringify(ra)+' B='+JSON.stringify(rb));
  }catch(e){ mark(r,false,e.message); }

  r=add('Two writers edit the SAME location at once → stale one REJECTED (no clobber)');
  try{
    const a0=(await freshLoc('SELFTEST Truck A'))[0];
    const s1=Object.assign({},a0); s1.name='SELFTEST Truck A (writer-1)';
    const s2=Object.assign({},a0); s2.name='SELFTEST Truck A (writer-2)';
    const w1=await InvLocationsDB.save(s1);
    const w2=await InvLocationsDB.save(s2);
    const after=(await freshLoc('SELFTEST Truck A'))[0];
    const ok = w1.ok && w2.conflict===true && after.name==='SELFTEST Truck A (writer-1)';
    mark(r, ok, ok?'Writer 1 saved; writer 2 rejected with a conflict; writer 1 kept.':'w1='+JSON.stringify(w1)+' w2='+JSON.stringify(w2)+' name='+(after&&after.name));
  }catch(e){ mark(r,false,e.message); }

  r=add('Location fields (type, fleet link, stable id) round-trip');
  try{
    const a=(await freshLoc('SELFTEST Truck A'))[0];
    const e1=Object.assign({},a); e1.assetId='veh-selftest-9'; e1.type='vehicle';
    const sv=await InvLocationsDB.save(e1);
    const after=(await freshLoc('SELFTEST Truck A'))[0];
    const ok = sv.ok && after.assetId==='veh-selftest-9' && after.type==='vehicle' && !!after.id && !!after._uuid;
    mark(r, ok, ok?('fleet link + type saved; app id="'+after.id+'" stays stable (stock keys to it), table uuid separate.'):'save='+JSON.stringify(sv)+' got='+JSON.stringify(after));
  }catch(e){ mark(r,false,e.message); }

  r=add('Retire (soft-delete) removes a location from the active list');
  try{
    const a=(await freshLoc('SELFTEST Truck A'))[0];
    await InvLocationsDB.retire(a._uuid);
    const still=(await freshLoc('SELFTEST Truck A')).length>0;
    mark(r, !still, !still?'Retired location no longer appears.':'still active after retire');
  }catch(e){ mark(r,false,e.message); }

  r=add('Auto-clean all SELFTEST locations');
  try{ const n=await softDeleteSelftestLocs(); const remain=(await freshLoc('SELFTEST')).length; mark(r, remain===0, remain===0?'cleaned up; no active SELFTEST locations remain.':(remain+' still active')); }catch(e){ mark(r,false,e.message); }

  // ---- RETIRE / TEARDOWN ----
  group('Retire & cleanup');
  r=add('Retire (soft-delete) removes a tool from the active list');
  try{
    const alpha=(await freshLoad(TAG+' ')).find(t=>t.name===TAG+' Alpha');
    await ToolsDB.retireTool(alpha._uuid);
    const still=(await freshLoad(TAG+' ')).some(t=>t.name===TAG+' Alpha');
    mark(r, !still, !still?'Retired tool no longer appears in the active list.':'tool still active after retire');
  }catch(e){ mark(r,false,e.message); }

  r=add('Auto-clean all SELFTEST data (checkouts + tools)');
  try{
    const nc=await softDeleteSelftestCheckouts();
    const n=await softDeleteSelftest();
    const remainCO=(await freshCO('SELFTEST')).length;
    const remainT=(await freshLoad('SELFTEST')).length;
    const ok = remainCO===0 && remainT===0;
    mark(r, ok, ok?'cleaned up; no active SELFTEST checkouts or tools remain.':(remainCO+' checkouts / '+remainT+' tools still active'));
  }catch(e){ mark(r,false,e.message); }

  finish();
}
function finish(){
  const pass=results.length>0 && results.every(Boolean);
  const v=document.getElementById('verdict');
  v.className='verdict '+(pass?'pass':'fail');
  v.textContent=(pass?'ALL CHECKS PASSED — data integrity holds':'SOME CHECKS FAILED — see red rows')+' ('+results.filter(Boolean).length+'/'+results.length+')';
  document.getElementById('run').disabled=false;
}
document.getElementById('run').addEventListener('click', run);
</script>
